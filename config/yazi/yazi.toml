# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
ratio      = [1, 4, 3]
sort_by    = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode   = "size_and_mtime"
show_hidden = false
show_symlink = false
scrolloff  = 10

# : }}}

# : Preview {{{

[preview]
wrap       = "no"
tab_size   = 4
max_width  = 1000
max_height = 1000
image_delay = 100
image_filter = "lanczos3"
image_quality = 90

# : }}}

# : Openers {{{

[opener]
edit = [
	{ run = "nvim %s", block = true, for = "unix" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open" },
]
image = [
	{ run = "imv %s", orphan = true, for = "unix" },
]
video = [
	{ run = "mpv %s", orphan = true, for = "unix" },
]
audio = [
	{ run = "mpv %s", orphan = true, for = "unix" },
]
archive = [
	{ run = "file-roller %s", orphan = true, for = "unix" },
]
document = [
	{ run = "zathura %s", orphan = true, for = "unix" },
]

# : }}}

# : Open rules {{{

[open]
rules = [
	{ mime = "text/*", use = "edit" },
	{ url = "*.{json,yaml,yml,toml,xml,ini,cfg,env,conf}", use = "edit" },
	{ mime = "image/*",                                      use = ["open", "image"] },
	{ mime = "video/*",                                      use = "video" },
	{ mime = "audio/*",                                      use = "audio" },
	{ mime = "application/pdf",                              use = "document" },
	{ mime = "application/{zip,tar,gzip,xz,7z,rar}",         use = "archive" },
	{ url = "*",                                             use = "open" },
]

# : }}}

# : Tasks {{{

[tasks]
file_workers  = 5
plugin_workers = 5
fetch_workers = 5
preload_workers = 5
process_workers = 5
bizarre_retry = 5

# : }}}

# : Input {{{

[input]
cursor_blink = true

cd_origin    = "top-center"
cd_offset    = [0, 2, 50, 3]
cd_title     = "Cd:"

create_origin = "top-center"
create_offset = [0, 2, 50, 3]
create_title  = ["Create:", "Create (dir):"]

rename_origin = "top-center"
rename_offset = [0, 2, 50, 3]
rename_title  = "Rename:"

filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]
filter_title  = "Filter:"

find_origin  = "top-center"
find_offset  = [0, 2, 50, 3]
find_title   = ["Find:", "Find (prev):"]

search_origin = "top-center"
search_offset = [0, 2, 50, 3]
search_title  = "Search ({n}):"

shell_origin  = "top-center"
shell_offset  = [0, 2, 50, 3]
shell_title   = ["Shell:", "Shell (block):"]

# : }}}

# : Confirm {{{

[confirm]
trash_origin  = "center"
trash_offset  = [0, 0, 50, 20]
trash_title   = "Trash"

delete_origin  = "center"
delete_offset  = [0, 0, 50, 20]
delete_title   = "Delete"

overwrite_origin  = "center"
overwrite_offset  = [0, 0, 50, 20]
overwrite_title   = "Overwrite"

quit_origin  = "center"
quit_offset  = [0, 0, 50, 20]
quit_title   = "Quit"

# : }}}

# : Plugin {{{

[plugin]
prepend_previewers = []
append_previewers  = []
prepend_preloaders = []
append_preloaders  = []

# : }}}
