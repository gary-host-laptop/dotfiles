#!/bin/bash

# modify_ script (chezmoi): RetroArch owns retroarch.cfg wholesale (writes the
# whole file on exit), so we can't track it as a plain/templated file — that
# always drifts. Instead this script is fed the current file on stdin and only
# guarantees the keys below ("key = \"value\""), leaving every other line alone.
#
# machine-specific: system_directory points at the fedora RomM bios mount.
# idempotent — running it on its own output is a no-op, so chezmoi status
# stays green between applies.

set -eu

tmp="$(mktemp)"
trap 'rm -f "$tmp" "$tmp.new"' EXIT
cat > "$tmp"

ensure() {
    local key="$1" value="$2"
    local regex="^${key}[[:space:]]*="
    awk -v re="$regex" -v kv="$key = $value" '
        $0 ~ re { print kv; found=1; next }
        { print }
        END { if (!found) print kv }
    ' "$tmp" > "$tmp.new"
    mv "$tmp.new" "$tmp"
}

# dirs — user-owned; cores are fetched to ~/.config/retroarch/cores.
# retroarch writes these itself in "~/.config/retroarch/..." form, so we enforce
# the same form to stay value-identical (no drift) between applies.
ensure libretro_directory "\"~/.config/retroarch/cores\""
ensure system_directory "\"/mnt/valus/35_video-games/games-library/bios\""
ensure savefile_directory "\"~/.config/retroarch/saves\""
ensure savestate_directory "\"~/.config/retroarch/states\""
ensure screenshot_directory "\"~/.config/retroarch/screenshots\""
ensure cache_directory "\"~/.config/retroarch/cache\""
ensure playlist_directory "\"~/.config/retroarch/playlists\""

# system data from the dnf packages (retroarch, retroarch-assets)
ensure assets_directory "\"/usr/share/libretro/assets\""
ensure libretro_info_path "\"/usr/share/libretro/info\""
ensure joypad_autoconfig_dir "\"/usr/share/libretro/autoconfig\""
ensure content_database_path "\"/usr/share/libretro/database/rdb\""

# drivers — glcore for the Vega APU (glcore AND gl both render this window
# borderless under GNOME Wayland; the build creates an unmanaged toplevel and
# ignores video_window_show_decorations, so prefer the faster driver). pipewire.
ensure video_driver "\"glcore\""
ensure audio_driver "\"pipewire\""
ensure menu_driver "\"ozone\""

# input
ensure input_autodetect_enable "\"true\""
ensure input_joypad_driver "\"sdl2\""

# window — explicit so GNOME Wayland attempts a titlebar
ensure video_window_show_decorations "\"true\""

cat "$tmp"