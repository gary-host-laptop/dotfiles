# machine/vendor env across shells & GUI apps — don't duplicate in exports.bash or env.nu
EDITOR=hx
BROWSER=firefox
XDG_DATA_HOME=$HOME/.local/share
XDG_CONFIG_HOME=$HOME/.config
XDG_CACHE_HOME=$HOME/.cache

# GUI/session PATH entry point. Fedora GDM sources ~/.profile during session start
# via /etc/gdm/Xsession -> /etc/X11/xinit/xinitrc-common, then starts a login shell
# that reads /etc/profile and ~/.bash_profile -> ~/.profile again. The second pass
# pins ~/.local/bin ahead of /etc/profile.d/ccache.sh. This file is the systemd
# --user baseline (applied before any shell) and is what early user services
# see. Both entry points are idempotent: ~/.profile's add-once guards and pin block
# no-op when the same dirs are already present, so the layers never stack duplicates.
# environment.d expands variables defined earlier in the user manager env, so
# $HOME keeps this source portable across machines.
PATH=$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.opencode/bin:/usr/local/go/bin${PATH:+:$PATH}
PKG_CONFIG_PATH=/usr/lib64/pkgconfig
