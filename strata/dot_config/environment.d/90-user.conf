# machine/vendor env across shells & GUI apps — don't duplicate in exports.bash or env.nu
EDITOR=hx
BROWSER=firefox
XDG_DATA_HOME=$HOME/.local/share
XDG_CONFIG_HOME=$HOME/.config
XDG_CACHE_HOME=$HOME/.cache

# GUI/session tree PATH root — two independent roots, both verified on this machine
# (fresh-login test): (1) environment.d is applied by systemd --user at boot (before
# any shell) — deterministic and proof against bash-imported leftovers; (2) Fedora
# GDM also sources /etc/profile -> ~/.profile during session start (the _DOTFILES_
# PROFILE_SOURCED flag and /etc/profile.d exports end up in the manager env), giving
# a second path to the same assembly. Idempotent by design: if a prefix dir is already
# present, ~/.profile's add-once guards and pin block no-op, so the two never stack
# entries. ~/.profile stays the bash login/tty assembler and the rescue fallback.
PATH=/home/ghost_user/.local/bin:/home/ghost_user/.cargo/bin:/home/ghost_user/.opencode/bin:/usr/local/go/bin${PATH:+:$PATH}
PKG_CONFIG_PATH=/usr/lib64/pkgconfig