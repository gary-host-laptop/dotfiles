# single source for EDITOR/BROWSER/XDG/PATH across shells & GUI apps — don't
# duplicate in exports.bash or env.nu
EDITOR=hx
BROWSER=firefox
XDG_DATA_HOME=$HOME/.local/share
XDG_CONFIG_HOME=$HOME/.config
XDG_CACHE_HOME=$HOME/.cache

# GUI/session tree PATH root. Declared here so systemd --user and everything it
# spawns (gnome-shell -> ghostty -> zellij -> nu) gets a deterministic PATH on a
# fresh login, independent of leftovers imported from bash. ~/.profile is the
# bash login/tty tree's separate assembler; both converge on the same set.
PATH=/home/ghost_user/.local/bin:/home/ghost_user/.cargo/bin:/home/ghost_user/.opencode/bin:/usr/local/go/bin${PATH:+:$PATH}
PKG_CONFIG_PATH=/usr/lib64/pkgconfig