#!/usr/bin/env python3

# modify_ script (chezmoi): antimicrox rewrites its settings.ini each session
# (window position/size, controller state), so a plain/templated tracked file
# always drifts. This normalizer is fed the current file on stdin and only
# enforces the meaningful keys below, preserving every other line (incl. the
# ephemeral WindowPosition/WindowSize). idempotent -> chezmoi status stays green.

import os
import re
import sys

home = os.environ.get("HOME", "")
amgp = home + "/.config/antimicrox/gamepad.gamecontroller.amgp"

GENERAL = {
    "DisplayNames": "0",
    "LastProfileDir": home + "/.config/antimicrox",
}

CONTROLLERS = {
    "Controller0300443e6d0400001fc20000050300001133496954B179D17ConfigFile1": amgp,
    "Controller0300443e6d0400001fc20000050300001133496954B179D17LastSelected": amgp,
    "Controller0300c5376d04000019c2000011010000113349689ConfigFile1": amgp,
    "Controller0300c5376d04000019c2000011010000113349689LastSelected": amgp,
}

HEADER_RE = re.compile(r"^\[(.+)\]$")


def main():
    lines = sys.stdin.read().splitlines()

    out = []
    seen = {}  # section name -> set of enforced keys already present
    section = None

    for line in lines:
        m = HEADER_RE.match(line.strip())
        if m:
            section = m.group(1).strip()
            seen.setdefault(section, set())
            out.append(line)
            continue
        if "=" in line:
            key = line.partition("=")[0].strip()
            mapping = None
            if section == "General":
                mapping = GENERAL
            elif section == "Controllers":
                mapping = CONTROLLERS
            if mapping and key in mapping:
                out.append(f"{key}={mapping[key]}")
                seen.setdefault(section, set()).add(key)
                continue
        out.append(line)

    # insert any missing enforced keys into their existing section (before the
    # next section header, or at end of file)
    for section_name, mapping in (("Controllers", CONTROLLERS), ("General", GENERAL)):
        missing = [f"{k}={v}" for k, v in mapping.items() if k not in seen.get(section_name, set())]
        if not missing:
            continue
        pos = None
        for i, l in enumerate(out):
            m = HEADER_RE.match(l.strip())
            if m and m.group(1).strip() == section_name:
                pos = i
        if pos is not None:
            end = len(out)
            for j in range(pos + 1, len(out)):
                if HEADER_RE.match(out[j].strip()):
                    end = j
                    break
            out[end:end] = missing
        else:
            header = f"[{section_name}]"
            if out and out[-1].strip():
                out.append("")
            out.append(header)
            out.extend(missing)

    sys.stdout.write("\n".join(out) + "\n")


if __name__ == "__main__":
    main()